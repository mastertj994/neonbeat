<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonBeat — Панель администратора</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: '#111827',
                        neonCyan: '#00f2fe',
                        neonPink: '#fe0095',
                        neonPurple: '#9d4edd',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Подключение стилей админки -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="min-h-screen flex flex-col selection:bg-neonPink selection:text-white">

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-panelBg border border-neonPink/40 rounded-2xl p-6 shadow-[0_0_30px_rgba(254,0,149,0.2)]">
            <div class="flex items-center justify-center space-x-2 mb-6">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-neonCyan to-neonPink flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved text-gray-950 font-bold text-sm"></i>
                </div>
                <div>
                    <span class="text-lg font-bold tracking-wider bg-gradient-to-r from-neonCyan via-white to-neonPink bg-clip-text text-transparent block leading-none">NEONBEAT ADMIN</span>
                    <span class="text-[9px] tracking-widest text-neonPink font-mono uppercase mt-0.5 block">Вход в систему</span>
                </div>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
    <div>
        <label class="block text-xs text-gray-400 mb-1">Логин</label>
        <input type="text" id="adminLoginInput" required placeholder="admin" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonCyan">
    </div>
    <div>
        <label class="block text-xs text-gray-400 mb-1">Пароль</label>
        <input type="password" id="adminPassInput" required placeholder="••••••••" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonPink">
    </div>
    <div>
        <label class="block text-xs text-gray-400 mb-1">GitHub Personal Access Token</label>
        <input type="password" id="adminTokenInput" required placeholder="ghp_..." class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonPink">
    </div>
    <p id="login-error" class="text-xs text-red-400 hidden">Неверный логин или пароль!</p>
    <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-neonCyan to-neonPink text-gray-950 font-bold rounded-xl text-xs shadow-lg hover:opacity-95 transition">
        Войти в панель
    </button>
</form>
        </div>
    </div>

    <!-- РАБОЧАЯ ПАНЕЛЬ АДМИНИСТРАТОРА -->
    <div id="admin-dashboard" class="hidden flex-1 flex flex-col">
        <header class="w-full bg-panelBg border-b border-gray-800 py-3 px-4 sticky top-0 z-30 shadow-md">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-neonCyan to-neonPink flex items-center justify-center">
                        <i class="fa-solid fa-sliders text-gray-950 text-xs"></i>
                    </div>
                    <div>
                        <h1 class="text-sm md:text-base font-bold text-white leading-none">NEONBEAT — Админ-панель</h1>
                        <span class="text-[10px] text-neonCyan font-mono">Управление порталом</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <a href="index.html" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-800 text-neonCyan hover:bg-gray-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>Открыть сайт</span>
                    </a>
                    <button onclick="logoutAdmin()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition">
                        Выйти
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <section class="bg-panelBg border border-neonPurple/40 rounded-2xl p-5 shadow-[0_0_20px_rgba(157,78,221,0.1)]">
    <h2 class="text-sm font-bold text-white mb-4 flex items-center justify-between">
        <span class="flex items-center space-x-2">
            <i class="fa-solid fa-user-clock text-neonPurple"></i>
            <span>Заявки от гостей на модерацию</span>
        </span>
        <span id="pending-count" class="text-xs text-neonPurple font-mono">0 шт.</span>
    </h2>
    <div id="admin-pending-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
        <!-- Сюда падают заявки -->
    </div>
</section>
            
            <!-- Блок 1: Добавление нового трека -->
            <section class="bg-panelBg border border-neonPink/40 rounded-2xl p-5 shadow-[0_0_20px_rgba(254,0,149,0.1)] h-fit">
                <h2 class="text-sm font-bold text-white mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-neonPink"></i>
                    <span>Добавить новый трек в плейлист</span>
                </h2>
                <form onsubmit="addNewTrack(event)" class="space-y-3.5">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Название трека</label>
                        <input type="text" id="newTitle" placeholder="Например: Ночной Душанбе" required class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-neonPink">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Исполнитель</label>
                        <input type="text" id="newArtist" placeholder="Имя артиста" required class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-neonPink">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Страна</label>
                            <select id="newCountry" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                                <option value="Россия">Россия</option>
                                <option value="Узбекистан">Узбекистан</option>
                                <option value="Таджикистан">Таджикистан</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Жанр</label>
                            <select id="newGenre" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                                <option value="Хип-хоп">Хип-хоп</option>
                                <option value="Поп">Поп</option>
                                <option value="Рок">Рок</option>
                                <option value="Электроника">Электроника</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Аудиофайл (MP3) или ссылка</label>
                        <input type="file" id="audioFile" accept="audio/mp3,audio/*" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonPink file:text-white hover:file:opacity-90">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Обложка трека (Картинка)</label>
                        <input type="file" id="coverFile" accept="image/*" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonCyan file:text-gray-950 hover:file:opacity-90">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-neonCyan to-neonPink text-gray-950 font-bold rounded-xl text-xs shadow-lg mt-2 hover:opacity-95 transition">
                        Загрузить и опубликовать
                    </button>
                </form>
            </section>

            <!-- Блок 2: Управление треками и отзывами -->
            <div class="space-y-6">
                <section class="bg-panelBg border border-gray-800 rounded-2xl p-5">
                    <h2 class="text-sm font-bold text-white mb-4 flex items-center justify-between">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-list-ul text-neonCyan"></i>
                            <span>Управление плейлистом</span>
                        </span>
                        <span id="tracks-count" class="text-xs text-neonCyan font-mono">0 шт.</span>
                    </h2>
                    <div id="admin-tracks-list" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                        <!-- Список треков -->
                    </div>
                </section>

                <section class="bg-panelBg border border-gray-800 rounded-2xl p-5">
                    <h2 class="text-sm font-bold text-white mb-4 flex items-center justify-between">
                        <span class="flex items-center space-x-2">
                            <i class="fa-solid fa-comments text-neonPurple"></i>
                            <span>Комментарии гостей</span>
                        </span>
                        <span id="comments-count" class="text-xs text-neonPurple font-mono">0 шт.</span>
                    </h2>
                    <div id="admin-comments-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        <!-- Список комментариев -->
                    </div>
                </section>
            </div>

        </main>
    </div>

    <!-- Подключение скрипта админки -->
    <script src="js/admin.js"></script>
</body>
</html>
