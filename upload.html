<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonBeat — Предложить трек</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonCyan: '#00f5ff',
                        neonPink: '#ff007f',
                        neonPurple: '#9d4edd',
                        bgDark: '#0a0a0f',
                        panelBg: '#13131a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDark text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-panelBg border border-neonCyan/40 rounded-2xl p-6 max-w-md w-full relative shadow-[0_0_30px_rgba(0,245,255,0.2)]">
        <!-- Кнопка возврата на главную -->
        <a href="index.html" class="absolute top-4 right-4 text-gray-400 hover:text-white">
            <i class="fa-solid fa-xmark text-lg"></i>
        </a>

        <h3 class="text-sm font-bold text-white mb-4 flex items-center space-x-2">
            <i class="fa-solid fa-cloud-arrow-up text-neonCyan"></i>
            <span>Предложить трек на модерацию</span>
        </h3>

        <form onsubmit="submitGuestTrack(event)" class="space-y-3">
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Название трека</label>
                <input type="text" id="guestTitle" required placeholder="Например: Pamir Breeze" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonCyan">
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Исполнитель</label>
                <input type="text" id="guestArtist" required placeholder="Имя артиста или группа" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonCyan">
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Страна</label>
                <input type="text" id="guestCountry" required placeholder="Таджикистан" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonCyan">
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Жанр</label>
                <input type="text" id="guestGenre" required placeholder="Поп / Рэп / Инди" class="w-full bg-black/50 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonCyan">
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Аудиофайл (MP3 с компьютера)</label>
                <input type="file" id="guestAudio" accept="audio/*" required class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-neonCyan/20 file:text-neonCyan hover:file:bg-neonCyan/30">
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Обложка / Картинка альбома</label>
                <input type="file" id="guestCover" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-neonPink/20 file:text-neonPink hover:file:bg-neonPink/30">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-neonCyan to-neonPink text-gray-950 font-bold rounded-xl text-xs shadow-lg mt-3 hover:opacity-95 transition">
                Отправить администратору
            </button>
        </form>
    </div>

</body>
</html>
